<div class="w-full sm:w-auto sm:relative" x-data="dropdownComponent({
        items: JSON.parse('{{ filter_ctx.items_json|escapejs }}'),
        selected: JSON.parse('{{ filter_ctx.selected_items_json|escapejs }}'),
        labelName: '{{ filter_ctx.label_name }}'
    })">
    <!-- Button -->
    <button
        type="button"
        @click="open = !open"
        class="btn-secondary w-full sm:w-auto max-sm:px-2 max-sm:text-sm"
    >
        <span class="sm:hidden" x-text="buttonLabelShort">{{ filter_ctx.initial_button_label_short }}</span>
        <span class="hidden sm:inline" x-text="buttonLabel">{{ filter_ctx.initial_button_label }}</span>
    </button>

    <!-- Dropdown -->
    <div
        x-show="open"
        @click.away="open = false"
        class="absolute left-0 right-0 sm:left-auto mt-1 sm:w-auto bg-white border border-line rounded-lg shadow-lg z-20"
        x-cloak
    >
        <div class="p-2 space-y-1">
            <!-- Select/Deselect All Option -->
            <label class="flex items-center space-x-2 py-1 font-semibold text-ink hover:bg-paper rounded-md px-2">
                <input type="checkbox"
                    @click="toggleSelectAll()"
                    :checked="selectedItems.length === allItems.length"
                    class="h-4 w-4 text-accent focus:ring-accent border-line rounded">
                <span class="text-nowrap">
                    Select All
                    <span class="text-muted font-normal">({{ filter_ctx.total_work_count }} works)</span>
                </span>
            </label>

            <!-- Scrollable area -->
            <div class="max-h-64 overflow-y-auto space-y-1 pr-2">
                {% for dropdown_item in filter_ctx.dropdown_items %}
                <label class="flex items-center space-x-2 py-1 hover:bg-paper rounded-md px-2">
                    <input
                        type="checkbox"
                        name="{{ filter_ctx.dropdown_name }}"
                        value="{{ dropdown_item.value }}"
                        x-model="selectedItems"
                        class="h-4 w-4 text-accent focus:ring-accent border-line rounded">
                    <span class="text-nowrap">
                            {% if dropdown_item.short_label %}
                                <span class="sm:hidden">{{ dropdown_item.short_label | capfirst }}</span>
                                <span class="hidden sm:inline">{{ dropdown_item.label | capfirst }}</span>
                            {% else %}
                                {{ dropdown_item.label | capfirst }}
                            {% endif %}
                            {% if dropdown_item.count is not None %}
                            <span class="text-muted font-normal">({{ dropdown_item.count }} works)</span>
                            {% endif %}
                    </span>
                </label>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
