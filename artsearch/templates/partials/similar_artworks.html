{% for result in similar_artworks %}
  {% url 'artwork-page' result.museum_slug result.object_number as page_url %}
  {% if page_url %}
  <a href="{{ page_url }}"
     class="block bg-white rounded-lg ring-1 ring-line overflow-hidden hover:ring-muted/60 transition">
    <img loading="lazy"
         src="{{ result.thumbnail_url }}"
         alt="{{ result.title }}"
         class="w-full h-40 object-contain bg-paper/60">
    <div class="p-2">
      <p class="text-sm font-semibold text-ink leading-snug line-clamp-2">{{ result.title }}</p>
      <p class="text-xs text-muted mt-1 line-clamp-1">{{ result.artist }}</p>
    </div>
  </a>
  {% endif %}
{% endfor %}

<!-- Replaced by the next batch of cards (and a new button, if there are more) -->
{% if similar_more_url %}
  <div class="col-span-full text-center mt-2">
    <button
      type="button"
      hx-get="{{ similar_more_url }}"
      hx-target="closest div"
      hx-swap="outerHTML"
      hx-disabled-elt="this"
      class="btn-secondary btn-sm"
      title="Load more artworks that look similar to this one">
      Show more
    </button>
  </div>
{% endif %}
