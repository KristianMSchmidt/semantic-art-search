{% extends "base.html" %}
{% load static %}

{% block head_extra %}
{% if map_data_version %}
<!-- Start downloading the map geometry with the page instead of after deck.gl and Alpine have loaded -->
<link rel="preload" href="{% url "art-map-geometry" %}?v={{ map_data_version }}" as="fetch" crossorigin>
{% endif %}
{% endblock head_extra %}

{% block content %}
<div x-data="artMap()" @keydown.escape.window="closeDetail()" class="relative border-t border-line" style="height: calc(100vh - 68px);">

    <!-- Loading spinner -->
    <div x-show="loading" class="absolute inset-0 flex items-center justify-center bg-paper z-10">
        <div class="text-center">
            <svg class="animate-spin h-10 w-10 text-accent mx-auto mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-muted text-sm">Loading art map...</p>
        </div>
    </div>

    <!-- Error state -->
    <div x-show="error" x-cloak class="absolute inset-0 flex items-center justify-center bg-paper z-10">
        <div class="text-center max-w-md px-4">
            <p class="text-red-600 text-sm" x-text="error"></p>
        </div>
    </div>

    <!-- Notice, e.g. when a linked artwork isn't on the map -->
    <div x-show="notice" x-cloak x-transition.opacity
         class="absolute top-4 left-1/2 -translate-x-1/2 z-30 bg-white rounded-lg shadow border border-line px-4 py-2 text-sm text-muted"
         x-text="notice"></div>

    <!-- Hint when the filters leave nothing on the map -->
    <div x-show="!loading && allHiddenText" x-cloak
         class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none text-sm text-muted text-center px-4"
         x-text="allHiddenText"></div>

    <!-- deck.gl canvas -->
    <canvas id="deck-canvas" class="w-full h-full"></canvas>

    <!-- Hover tooltip -->
    <div x-show="tooltip.visible" x-cloak
         class="fixed pointer-events-none z-30 bg-white rounded-lg shadow-lg border border-line overflow-hidden"
         style="width: 400px;"
         :style="`left: ${tooltip.x + 12}px; top: ${tooltip.y + 12}px;`">
        <div class="bg-paper flex items-center justify-center" style="height: 280px;">
            <img x-show="tooltip.imageUrl && !tooltip.imageError"
                 :src="tooltip.imageUrl"
                 alt=""
                 style="max-width: 400px; max-height: 280px; object-fit: contain;"
                 @error="tooltip.imageError = true">
        </div>
        <div class="px-3 py-2">
            <p class="text-sm font-semibold text-ink truncate" x-text="tooltip.title"></p>
            <p class="text-xs text-muted truncate" x-text="tooltip.artist"></p>
            <p class="text-xs text-muted/80" x-text="tooltip.museum"></p>
        </div>
    </div>

    <!-- Click detail panel -->
    <div x-show="detail.visible" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         class="absolute bottom-4 left-4 z-20 bg-white rounded-lg shadow-xl border border-line w-72 overflow-hidden">
        <!-- Thumbnail -->
        <div class="relative bg-paper">
            <img x-show="detail.imageUrl && !detail.imageError"
                 :src="detail.imageUrl"
                 :alt="detail.title"
                 class="w-full h-48 object-contain"
                 @error="detail.imageError = true">
            <button @click="closeDetail()"
                    class="absolute top-2 right-2 bg-black/40 hover:bg-black/60 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs transition">
                &times;
            </button>
        </div>
        <!-- Info -->
        <div class="p-3 space-y-1">
            <h3 class="text-sm font-semibold text-ink leading-snug" x-text="detail.title"></h3>
            <p class="text-xs text-muted" x-text="detail.artist"></p>
            <div class="flex items-center gap-2 text-xs text-muted/80">
                <span x-text="detail.productionDate"></span>
                <span>&middot;</span>
                <span x-text="detail.museum"></span>
            </div>
            <div class="flex flex-wrap gap-x-4 gap-y-1 pt-2">
                <a :href="detail.pagePath" class="link-action" title="Open the page for this artwork">Open artwork</a>
                <a :href="detail.similarUrl" class="link-action" title="Find artworks that look similar to this one">Find similar</a>
            </div>
        </div>
    </div>

    <!-- Zoom controls -->
    <div class="absolute bottom-4 right-4 z-20 flex flex-col gap-1">
        <button @click="zoomIn()"
                class="bg-white/90 backdrop-blur-sm shadow border border-line rounded-lg w-9 h-9 flex items-center justify-center text-muted hover:bg-paper text-lg font-bold transition">+</button>
        <button @click="zoomOut()"
                class="bg-white/90 backdrop-blur-sm shadow border border-line rounded-lg w-9 h-9 flex items-center justify-center text-muted hover:bg-paper text-lg font-bold transition">&minus;</button>
    </div>

    <!-- Legend and search box, shown once the map has drawn: until the geometry loads we
         don't know whether there is a Century mode, and the panels would float over the
         spinner. Side by side on wider screens; on phones the search box goes on top. -->
    <div x-show="!loading && !error" x-cloak
         class="absolute z-20 top-4 left-4 right-4 flex flex-col-reverse sm:flex-row sm:justify-between items-start gap-2 pointer-events-none">
    <div class="pointer-events-auto bg-white/90 backdrop-blur-sm rounded-lg shadow border border-line px-4" style="padding-top: 0.75rem; padding-bottom: 0.75rem;">
        <!-- Toggle -->
        <div class="flex items-center gap-1 text-xs" :class="legendOpen && 'mb-2'">
            <button @click="setColorMode('work_type')"
                    :class="colorMode === 'work_type' ? 'bg-accent text-white' : 'bg-paper text-muted hover:bg-line'"
                    class="px-2 py-0.5 rounded transition-colors">Work type</button>
            <button @click="setColorMode('museum')"
                    :class="colorMode === 'museum' ? 'bg-accent text-white' : 'bg-paper text-muted hover:bg-line'"
                    class="px-2 py-0.5 rounded transition-colors">Museum</button>
            <!-- Maps generated before centuries were added have no year data -->
            <button x-show="hasCenturies || colorMode === 'century'" x-cloak @click="setColorMode('century')"
                    :class="colorMode === 'century' ? 'bg-accent text-white' : 'bg-paper text-muted hover:bg-line'"
                    class="px-2 py-0.5 rounded transition-colors">Century</button>
            <!-- Collapse the legend items (collapsed by default on small screens) -->
            <button type="button" @click="legendOpen = !legendOpen"
                    :title="legendOpen ? 'Hide legend' : 'Show legend'"
                    :aria-expanded="legendOpen"
                    class="ml-1 -mr-1 w-6 h-6 flex items-center justify-center rounded text-muted hover:bg-paper hover:text-ink transition-colors">
                <svg class="w-4 h-4 transition-transform" :class="legendOpen && 'rotate-180'" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>
        </div>
        <!-- While collapsed, still say that filters are on -->
        <p x-show="!legendOpen && hiddenCountText" x-cloak class="mt-1 text-xs text-muted" x-text="hiddenCountText"></p>
        <div x-show="legendOpen" x-cloak class="overflow-y-auto" style="max-height: calc(100vh - 68px - 12rem);">
        <!-- Legend items: click to hide or show -->
        <template x-for="item in legendItems" :key="colorMode + '-' + item.index">
            <button type="button" @click="toggleHidden(item.index)"
                    :title="item.hidden ? `Show ${item.label}` : `Hide ${item.label}`"
                    :aria-pressed="!item.hidden"
                    class="flex items-center gap-2 py-0.5 w-full text-left group">
                <span class="inline-block w-3 h-3 rounded-full border transition"
                      :style="item.hidden
                          ? `border-color: rgb(${item.color.join(',')}); background: transparent`
                          : `border-color: rgb(${item.color.join(',')}); background: rgb(${item.color.join(',')})`"></span>
                <span class="text-xs transition group-hover:text-ink"
                      :class="item.hidden ? 'text-muted/60 line-through' : 'text-muted'"
                      x-text="item.label"></span>
            </button>
        </template>
        <!-- Filters, including ones set in the other colour modes -->
        <div class="mt-2 pt-2 border-t border-line text-xs text-muted space-y-0.5">
            <p x-show="otherModeHiddenText" x-cloak x-text="otherModeHiddenText"></p>
            <div class="flex gap-3">
                <!-- Both act on the current colour mode only -->
                <button type="button" @click="showAll()" :disabled="!legendItems.some((item) => item.hidden)"
                        class="link-action disabled:opacity-40 disabled:pointer-events-none">Show all</button>
                <button type="button" @click="hideAll()" :disabled="legendItems.every((item) => item.hidden)"
                        class="link-action disabled:opacity-40 disabled:pointer-events-none">Hide all</button>
            </div>
        </div>
        </div>
    </div>

    <!-- Search: highlights the closest Visual Search matches and zooms to them -->
    <form @submit.prevent="runSearch()" role="search" class="pointer-events-auto w-full sm:w-80">
        <div class="flex items-center bg-white/90 backdrop-blur-sm rounded-lg shadow border border-line">
            <input type="text" enterkeyhint="search" x-model="searchQuery" maxlength="{{ max_query_length }}"
                   placeholder="Search the map, e.g. ships in a storm"
                   aria-label="Search the map"
                   @keydown.escape.stop="clearSearch()"
                   class="flex-1 min-w-0 bg-transparent border-0 pl-3 py-2 text-sm text-ink placeholder:text-muted focus:outline-none focus:ring-0">
            <button type="button" x-show="search.active || searchQuery" x-cloak @click="clearSearch()"
                    title="Clear search" aria-label="Clear search"
                    class="w-8 h-9 flex items-center justify-center text-muted hover:text-ink text-lg">&times;</button>
            <button type="submit" :disabled="search.loading" title="Search" aria-label="Search"
                    class="w-9 h-9 flex items-center justify-center text-muted hover:text-ink disabled:opacity-60">
                <svg x-show="!search.loading" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path stroke-linecap="round" d="M20 20l-3.5-3.5"></path>
                </svg>
                <svg x-show="search.loading" x-cloak class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </button>
        </div>
        <div x-show="search.error || search.active" x-cloak aria-live="polite"
             class="mt-1 bg-white/90 backdrop-blur-sm rounded-lg shadow border border-line px-3 py-1.5 text-xs">
            <p x-show="search.error" class="text-red-600" x-text="search.error"></p>
            <template x-if="search.active && !search.error">
                <p class="text-muted">
                    <span x-text="searchStatusText"></span>
                    <a :href="searchResultsUrl" class="link-action ml-1 whitespace-nowrap">See as list</a>
                </p>
            </template>
        </div>
    </form>
    </div>
</div>

<script src="https://unpkg.com/deck.gl@9.1.15/dist.min.js"></script>
<script>
function artMap() {
    const BUCKET_REGION = '{{ bucket_region }}';
    const BUCKET_NAME = '{{ bucket_name }}';
    const MUSEUM_SLUGS = {{ museum_slugs_json|safe }};
    const MUSEUM_NAMES = {{ museum_names_json|safe }};
    const WORK_TYPE_LABELS = {{ work_type_labels_json|safe }};
    const CENTURY_SLUGS = {{ century_slugs_json|safe }};
    const CENTURY_NAMES = {{ century_names_json|safe }};
    const UNDATED_CENTURY = CENTURY_SLUGS.length - 1;
    // Legend noun per colour mode, for "2 museums, 1 century hidden"
    const MODE_NOUNS = { museum: ['museum', 'museums'], work_type: ['work type', 'work types'], century: ['century', 'centuries'] };
    const MODE_BUTTONS = { museum: 'Museum', work_type: 'Work type', century: 'Century' };
    const HOME_URL = '{% url "home" %}';
    const MAP_SEARCH_URL = '{% url "art-map-search" %}';
    const SEARCH_DIM_ALPHA = 35;  // alpha of points that aren't search matches
    const ARTWORK_PAGE_URL = '{% url "artwork-page" "__slug__" "__object__" %}';
    const SELECTED_ZOOM = 4;  // zoom level when flying to a linked artwork

    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    // "<museum index>/<object number>" -> point index, built on first use. Kept out of
    // the Alpine state so its many entries aren't made reactive
    let pointLookup = null;
    // deck.gl binary attributes for the artworks layer (positions, RGBA colours per
    // colour mode), built once in createDeck. Also kept out of the Alpine state: deck.gl
    // reads them directly instead of calling an accessor per point, which (through
    // Alpine's proxies) took seconds for ~180k points
    let pointAttributes = null;
    // Last legend-filter mask for the artworks layer, with the hidden lists it was built for
    let visibilityMask = null;

    return {
        loading: true,
        error: null,
        deckgl: null,
        colorMode: 'work_type',

        // Lazy-loaded metadata (titles, artists, etc.)
        _metadata: null,
        // Museum indices from geometry (for hover/click before metadata loads)
        _museumIndices: null,

        museumColors: [
            [231, 76, 60],    // smk - red
            [46, 134, 193],   // cma - blue
            [243, 156, 18],   // rma - orange
            [39, 174, 96],    // met - green
            [142, 68, 173],   // aic - purple
            [233, 30, 99],    // nga - pink
            [0, 150, 136],    // fng - teal
        ],
        workTypeColors: [
            [231, 76, 60],    // painting - red
            [46, 134, 193],   // print - blue
            [39, 174, 96],    // drawing - green
            [52, 152, 219],   // watercolor - light blue
            [243, 156, 18],   // design - orange
            [155, 89, 182],   // bust - purple
            [241, 196, 15],   // pastel - yellow
            [26, 188, 156],   // aquatint - teal
            [230, 126, 34],   // gouache - dark orange
            [52, 73, 94],     // miniature - dark blue-gray
            [149, 165, 166],  // other - gray
        ],
        // Plasma ramp from oldest to newest, so time order reads as a gradient
        centuryColors: [
            [13, 8, 135],     // before 1400 - dark blue
            [84, 2, 163],     // 1400s - indigo
            [139, 10, 165],   // 1500s - purple
            [185, 50, 137],   // 1600s - magenta
            [219, 92, 104],   // 1700s - pink-red
            [244, 136, 73],   // 1800s - orange
            [252, 179, 47],   // 1900s and later - gold
            [149, 165, 166],  // undated - gray
        ],

        // Century group per point, or null for geometry generated before centuries were added
        _centuryIndices: null,
        hasCenturies: false,
        _positions: null,

        // Indices of museums / work types / centuries hidden via the legend; all apply in every colour mode
        hiddenMuseums: [],
        hiddenWorkTypes: [],
        hiddenCenturies: [],

        // The legend items take up much of a phone screen, so start collapsed there
        legendOpen: window.matchMedia('(min-width: 640px)').matches,

        _hiddenKey(mode) {
            return { museum: 'hiddenMuseums', work_type: 'hiddenWorkTypes', century: 'hiddenCenturies' }[mode];
        },

        get legendItems() {
            if (this.colorMode === 'museum') {
                return MUSEUM_NAMES.map((name, i) => ({
                    index: i, label: name, color: this.museumColors[i], hidden: this.hiddenMuseums.includes(i),
                }));
            }
            if (this.colorMode === 'century') {
                return CENTURY_NAMES.map((name, i) => ({
                    index: i, label: name, color: this.centuryColors[i], hidden: this.hiddenCenturies.includes(i),
                }));
            }
            return WORK_TYPE_LABELS.map((label, i) => ({
                index: i,
                label: label.charAt(0).toUpperCase() + label.slice(1),
                color: this.workTypeColors[i],
                hidden: this.hiddenWorkTypes.includes(i),
            }));
        },

        // e.g. "2 museums, 1 century hidden", counting the given colour modes' filters
        _hiddenSummary(modes) {
            const parts = modes
                .map((mode) => {
                    const n = this[this._hiddenKey(mode)].length;
                    const [one, many] = MODE_NOUNS[mode];
                    return n ? `${n} ${n > 1 ? many : one}` : '';
                })
                .filter(Boolean);
            return parts.length ? `${parts.join(', ')} hidden` : '';
        },

        // Filters from the other colour mode aren't visible in the legend, so mention them
        get otherModeHiddenText() {
            return this._hiddenSummary(Object.keys(MODE_NOUNS).filter((mode) => mode !== this.colorMode));
        },

        // All filters, for the collapsed legend
        get hiddenCountText() {
            return this._hiddenSummary(Object.keys(MODE_NOUNS));
        },

        toggleHidden(index) {
            const key = this._hiddenKey(this.colorMode);
            const hidden = this[key];
            // Kept sorted, so the same filters give the same layer key and URL
            this[key] = hidden.includes(index)
                ? hidden.filter((i) => i !== index)
                : [...hidden, index].sort((a, b) => a - b);
            this._filtersChanged();
        },

        // When every museum, work type or century is hidden no point can show; say how to get them back
        get allHiddenText() {
            const counts = { museum: MUSEUM_SLUGS.length, work_type: WORK_TYPE_LABELS.length, century: CENTURY_SLUGS.length };
            if (this[this._hiddenKey(this.colorMode)].length === counts[this.colorMode]) {
                return 'Everything is hidden. Click a legend item to show it.';
            }
            const mode = Object.keys(counts).find((m) => this[this._hiddenKey(m)].length === counts[m]);
            return mode ? `All ${MODE_NOUNS[mode][1]} are hidden. Switch to ${MODE_BUTTONS[mode]} to show some.` : '';
        },

        hideAll() {
            this[this._hiddenKey(this.colorMode)] = this.legendItems.map((item) => item.index);
            this._filtersChanged();
        },

        showAll() {
            this[this._hiddenKey(this.colorMode)] = [];
            this._filtersChanged();
        },

        _filtersChanged() {
            this.tooltip.visible = false;
            if (this.selectedIndex >= 0 && this._isHidden(this.selectedIndex)) {
                this.closeDetail();
            }
            this._render();
            this._updateUrl();
        },

        // Geometry from an older WORK_TYPE_LABELS may hold unknown indices; treat them as "other".
        // _visibilityMask() inlines this and _centuryOf for speed; keep them in step
        _workTypeOf(idx) {
            const wt = this._workTypeIndices[idx];
            return wt < WORK_TYPE_LABELS.length ? wt : WORK_TYPE_LABELS.length - 1;
        },

        _centuryOf(idx) {
            return this._centuryIndices ? this._centuryIndices[idx] : UNDATED_CENTURY;
        },

        _isHidden(idx) {
            return this.hiddenMuseums.includes(this._museumIndices[idx])
                || this.hiddenWorkTypes.includes(this._workTypeOf(idx))
                || this.hiddenCenturies.includes(this._centuryOf(idx));
        },

        tooltip: { visible: false, x: 0, y: 0, title: '', artist: '', museum: '', imageUrl: '', imageError: false },
        detail: { visible: false, imageUrl: '', title: '', artist: '', productionDate: '', museum: '', museumSlug: '', objectNumber: '', pagePath: '', similarUrl: '', imageError: false },
        notice: '',

        // Search box text, and the search being shown (point indices best match first;
        // `missing` counts matches loaded after the last `make art-map`)
        searchQuery: '',
        search: { active: false, loading: false, query: '', indices: [], missing: 0, error: '' },
        _searchId: 0,
        // Bumped whenever the shown matches change, to rebuild the layers
        _searchVersion: 0,
        // Resolves once the metadata (object numbers) has loaded or failed
        _metadataLoaded: null,
        // ?q= from the URL until runSearch has run it, so URL updates meanwhile keep it
        _urlQuery: '',

        get searchStatusText() {
            const total = this.search.indices.length;
            if (!total) return `No matches for “${this.search.query}” are on the map yet.`;
            const hidden = this.search.indices.filter((idx) => this._isHidden(idx)).length;
            let text = `${total} closest ${total === 1 ? 'match' : 'matches'} for “${this.search.query}”`;
            if (hidden) text += `, ${hidden} hidden by the legend filters`;
            if (this.search.missing) text += `, ${this.search.missing} not on the map yet`;
            return `${text}.`;
        },

        get searchResultsUrl() {
            return `${HOME_URL}?${new URLSearchParams({ query: this.search.query })}`;
        },

        async runSearch(fitView = true) {
            const query = this.searchQuery.trim();
            if (!query) {
                this.clearSearch();
                return;
            }
            const id = ++this._searchId;
            this.search = { ...this.search, loading: true, error: '' };
            let indices = [], missing = 0, error = '';
            try {
                const resp = await fetch(`${MAP_SEARCH_URL}?${new URLSearchParams({ query })}`);
                const data = await resp.json().catch(() => ({}));
                await this._metadataLoaded;
                if (!resp.ok) {
                    error = data.error || 'Something went wrong with the search. Please try again.';
                } else if (!this._metadata) {
                    error = "Couldn't load the artwork details, so search results can't be shown.";
                } else {
                    const seen = new Set();
                    for (const [slug, objectNumber] of data.results) {
                        const idx = this._lookupIndex(MUSEUM_SLUGS.indexOf(slug), objectNumber);
                        if (idx < 0) missing++;
                        else if (!seen.has(idx)) { seen.add(idx); indices.push(idx); }
                    }
                }
            } catch (e) {
                error = 'The search failed. Check your connection and try again.';
            }
            if (id !== this._searchId) return;  // cleared or replaced meanwhile
            // A failed shared search (?q=) stays in the URL, so a reload can retry it
            if (!error) {
                this._urlQuery = '';
                this._searchVersion++;
            }
            // A failed search keeps the previous results on the map
            this.search = error
                ? { ...this.search, loading: false, error }
                : { active: true, loading: false, query, indices, missing, error: '' };
            this.tooltip.visible = false;
            this._render();
            this._updateUrl();
            if (!error && fitView) this._fitToSearch();
        },

        clearSearch() {
            this._searchId++;
            this._urlQuery = '';
            this.searchQuery = '';
            const wasActive = this.search.active || this.search.loading;
            this.search = { active: false, loading: false, query: '', indices: [], missing: 0, error: '' };
            if (wasActive) {
                this._searchVersion++;
                this._render();
                this._updateUrl();
            }
        },

        // Zoom to where the shown matches gather, ignoring the 5% furthest out on each side
        _fitToSearch() {
            const shown = this.search.indices.filter((idx) => !this._isHidden(idx));
            const indices = shown.length ? shown : this.search.indices;
            if (!indices.length) return;
            const quantile = (values, q) => values[Math.min(values.length - 1, Math.floor(q * values.length))];
            const xs = indices.map((idx) => this._positions[idx * 2]).sort((a, b) => a - b);
            const ys = indices.map((idx) => this._positions[idx * 2 + 1]).sort((a, b) => a - b);
            const [x0, x1] = [quantile(xs, 0.05), quantile(xs, 0.95)];
            const [y0, y1] = [quantile(ys, 0.05), quantile(ys, 0.95)];
            const canvas = document.getElementById('deck-canvas');
            // Map units at zoom 0 are pixels; leave a margin around the matches
            const zoom = Math.log2(Math.min(
                canvas.clientWidth / Math.max((x1 - x0) * 1.3, 1),
                canvas.clientHeight / Math.max((y1 - y0) * 1.3, 1),
            ));
            this._viewTarget = [(x0 + x1) / 2, (y0 + y1) / 2];
            this._currentZoom = Math.min(Math.max(zoom, -3), SELECTED_ZOOM);
            this.deckgl.setProps({ initialViewState: { target: this._viewTarget, zoom: this._currentZoom, transitionDuration: 1000 } });
        },

        // Highlighted search matches, drawn over the dimmed map (best match on top)
        _buildSearchLayer(colorArray) {
            const { deck } = window;
            const self = this;
            const positions = this._positions;
            const data = this.search.indices.filter((idx) => !this._isHidden(idx)).reverse();
            const colors = colorArray.value;
            // Picking reports the index into `data`; hand the handlers the point index
            const pointInfo = (info) => ({ ...info, index: info.index >= 0 ? data[info.index] : -1 });
            return new deck.ScatterplotLayer({
                id: 'search-results',
                data,
                getPosition: (idx) => [positions[idx * 2], positions[idx * 2 + 1]],
                getFillColor: (idx) => [colors[idx * 4], colors[idx * 4 + 1], colors[idx * 4 + 2], 255],
                getRadius: 5,
                radiusUnits: 'pixels',
                stroked: true,
                getLineColor: [255, 255, 255],
                getLineWidth: 1.5,
                lineWidthUnits: 'pixels',
                pickable: true,
                onHover: (info) => self._onHover(pointInfo(info)),
                onClick: (info) => self._onClick(pointInfo(info)),
            });
        },

        // Point index of the selected artwork (ringed on the map, kept in the URL), or -1
        selectedIndex: -1,
        // ?artwork= from the URL until _selectFromUrl has looked it up
        _linkedArtwork: null,
        _pulseRadius: 0,
        _pulseId: 0,
        _urlTimer: null,
        _artworksLayer: null,
        _searchLayer: null,
        _artworksLayerKey: null,

        _currentZoom: -0.5,

        zoomIn() {
            this._currentZoom = Math.min(this._currentZoom + 0.5, 10);
            this.deckgl.setProps({ initialViewState: { target: this._viewTarget || [500, 500], zoom: this._currentZoom, transitionDuration: 200 } });
        },

        zoomOut() {
            this._currentZoom = Math.max(this._currentZoom - 0.5, -3);
            this.deckgl.setProps({ initialViewState: { target: this._viewTarget || [500, 500], zoom: this._currentZoom, transitionDuration: 200 } });
        },

        setColorMode(mode) {
            this.colorMode = mode;
            this._render();
            this._updateUrl();
        },

        // The artworks layer is rebuilt only when the colour mode or filters change,
        // so the per-frame pulse redraws just the ring
        _render() {
            if (!this.deckgl) return;
            this.deckgl.setProps({ layers: this._layers() });
        },

        _layers() {
            const key = `${this.colorMode}|${this.hiddenMuseums}|${this.hiddenWorkTypes}|${this.hiddenCenturies}|${this._searchVersion}`;
            if (this._artworksLayerKey !== key) {
                const colorArray = pointAttributes.colors[this.colorMode];
                this._artworksLayer = this._buildLayer(colorArray, this.search.active);
                this._searchLayer = this.search.active ? this._buildSearchLayer(colorArray) : null;
                this._artworksLayerKey = key;
            }
            const layers = [this._artworksLayer];
            if (this._searchLayer) layers.push(this._searchLayer);
            if (this.selectedIndex >= 0) layers.push(this._buildSelectedLayer());
            return layers;
        },

        _imageUrl(slug, objectNumber) {
            return `https://${BUCKET_REGION}.linodeobjects.com/${BUCKET_NAME}/${slug}_${objectNumber}.jpg`;
        },

        // Object numbers can contain '/', which the artwork route keeps as is
        _artworkPagePath(slug, objectNumber) {
            return ARTWORK_PAGE_URL
                .replace('__slug__', encodeURIComponent(slug))
                .replace('__object__', encodeURIComponent(objectNumber).replace(/%2F/g, '/'));
        },

        // Ring around the selected artwork; _pulseRadius briefly enlarges it
        _buildSelectedLayer() {
            const { deck } = window;
            const i = this.selectedIndex;
            return new deck.ScatterplotLayer({
                id: 'selected',
                data: [[this._positions[i * 2], this._positions[i * 2 + 1]]],
                getPosition: (d) => d,
                getRadius: 8 + this._pulseRadius,
                radiusUnits: 'pixels',
                filled: false,
                stroked: true,
                getLineColor: [31, 36, 33],
                getLineWidth: 2.5,
                lineWidthUnits: 'pixels',
            });
        },

        _pulse() {
            const id = ++this._pulseId;
            const start = performance.now();
            const step = (now) => {
                if (id !== this._pulseId) return;
                const t = (now - start) / 1600;
                // Two rings shrinking from 24px onto the point
                this._pulseRadius = t < 1 && this.selectedIndex >= 0 ? 24 * (1 - (t * 2) % 1) : 0;
                this._render();
                if (this._pulseRadius > 0) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        },

        _select(idx) {
            const m = this._metadata;
            const museumIdx = this._museumIndices[idx];
            const museumSlug = MUSEUM_SLUGS[museumIdx];
            const objNum = m.object_number[idx];
            this.selectedIndex = idx;
            this.detail = {
                visible: true,
                imageError: false,
                imageUrl: this._imageUrl(museumSlug, objNum),
                title: m.title[idx] || 'Untitled',
                artist: m.artist[idx] || 'Unknown',
                productionDate: m.production_date[idx] || '',
                museum: MUSEUM_NAMES[museumIdx],
                museumSlug,
                objectNumber: objNum,
                pagePath: this._artworkPagePath(museumSlug, objNum),
                similarUrl: `${HOME_URL}?${new URLSearchParams({ query: `${museumSlug}:${objNum}` })}`,
            };
            this._render();
            this._updateUrl();
        },

        closeDetail() {
            if (!this.detail.visible) return;
            this.detail.visible = false;
            this.selectedIndex = -1;
            this._render();
            this._updateUrl();
        },

        // Point index of an artwork, or -1 if it isn't on the map (needs the metadata)
        _lookupIndex(museumIdx, objectNumber) {
            if (!pointLookup) {
                const objNums = this._metadata.object_number;
                const museums = this._museumIndices;
                pointLookup = new Map();
                for (let i = 0; i < objNums.length; i++) pointLookup.set(`${museums[i]}/${objNums[i]}`, i);
            }
            const idx = pointLookup.get(`${museumIdx}/${objectNumber}`);
            return idx === undefined ? -1 : idx;
        },

        // ?artwork=<museum_slug>/<object_number> (from "Show on map"): select it,
        // and fly to it unless the URL also sets the view
        _selectFromUrl(hasView) {
            const ref = this._linkedArtwork;
            this._linkedArtwork = null;
            if (!ref) return;
            if (!this._metadata) {
                this.notice = "Couldn't load the artwork details, so the linked artwork can't be shown.";
                return;
            }
            const slash = ref.indexOf('/');
            const museumIdx = MUSEUM_SLUGS.indexOf(ref.slice(0, slash));
            const idx = slash > 0 && museumIdx >= 0 ? this._lookupIndex(museumIdx, ref.slice(slash + 1)) : -1;
            if (idx < 0) {
                this.notice = "This artwork isn't on the map yet.";
                setTimeout(() => { this.notice = ''; }, 5000);
                this._updateUrl();
                return;
            }
            // Show the linked artwork even if the URL's filters would hide it
            if (this._isHidden(idx)) {
                this.hiddenMuseums = this.hiddenMuseums.filter((i) => i !== this._museumIndices[idx]);
                this.hiddenWorkTypes = this.hiddenWorkTypes.filter((i) => i !== this._workTypeOf(idx));
                this.hiddenCenturies = this.hiddenCenturies.filter((i) => i !== this._centuryOf(idx));
            }
            this._select(idx);
            if (!hasView) {
                this._viewTarget = [this._positions[idx * 2], this._positions[idx * 2 + 1]];
                this._currentZoom = Math.max(this._currentZoom, SELECTED_ZOOM);
                this.deckgl.setProps({ initialViewState: { target: this._viewTarget, zoom: this._currentZoom, transitionDuration: 1000 } });
            }
            this._pulse();
        },

        // View (?x=&y=&z=) from a shared map URL, or null
        _viewFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const [x, y, z] = ['x', 'y', 'z'].map((k) => parseFloat(params.get(k)));
            if (![x, y, z].every(Number.isFinite)) return null;
            return { target: [x, y], zoom: z };
        },

        // Colour mode (?color=museum|century) and legend filters
        // (?hide_museums=smk,cma&hide_types=print&hide_centuries=1500s,undated)
        _filtersFromUrl() {
            const params = new URLSearchParams(window.location.search);
            if (['museum', 'century'].includes(params.get('color'))) this.colorMode = params.get('color');
            const indices = (name, values) => [...new Set((params.get(name) || '').split(',')
                .map((v) => values.indexOf(v)).filter((i) => i >= 0))].sort((a, b) => a - b);
            this.hiddenMuseums = indices('hide_museums', MUSEUM_SLUGS);
            this.hiddenWorkTypes = indices('hide_types', WORK_TYPE_LABELS);
            this.hiddenCenturies = indices('hide_centuries', CENTURY_SLUGS);
        },

        // Keep the selection, colour mode, filters and (once moved) the view in the
        // URL, so it can be shared
        _updateUrl() {
            const params = new URLSearchParams();
            const searchQuery = this.search.active ? this.search.query : this._urlQuery;
            if (searchQuery) params.set('q', searchQuery);
            if (this.selectedIndex >= 0) {
                params.set('artwork', `${this.detail.museumSlug}/${this.detail.objectNumber}`);
            } else if (this._linkedArtwork) {
                // Not looked up yet (metadata still loading); keep it for _selectFromUrl
                params.set('artwork', this._linkedArtwork);
            }
            if (this.colorMode !== 'work_type') params.set('color', this.colorMode);
            if (this.hiddenMuseums.length) {
                params.set('hide_museums', this.hiddenMuseums.map((i) => MUSEUM_SLUGS[i]).join(','));
            }
            if (this.hiddenWorkTypes.length) {
                params.set('hide_types', this.hiddenWorkTypes.map((i) => WORK_TYPE_LABELS[i]).join(','));
            }
            if (this.hiddenCenturies.length) {
                params.set('hide_centuries', this.hiddenCenturies.map((i) => CENTURY_SLUGS[i]).join(','));
            }
            if (this._viewTarget) {
                // Map units run 0-1000; at high zoom one unit is hundreds of pixels
                params.set('x', this._viewTarget[0].toFixed(3));
                params.set('y', this._viewTarget[1].toFixed(3));
                params.set('z', this._currentZoom.toFixed(2));
            }
            // Commas need no escaping in a query string; keep the filter lists readable
            const query = params.toString().replace(/%2C/g, ',');
            history.replaceState(null, '', query ? `?${query}` : window.location.pathname);
        },

        // 1 for points the legend filters leave visible, 0 for hidden ones
        _visibilityMask() {
            // Colour mode and search changes rebuild the layer too; reuse the mask then
            const key = `${this.hiddenMuseums}|${this.hiddenWorkTypes}|${this.hiddenCenturies}`;
            if (visibilityMask && visibilityMask.key === key) return visibilityMask.value;
            const museums = this._museumIndices;
            const workTypes = this._workTypeIndices;
            const centuries = this._centuryIndices;
            const lastWorkType = WORK_TYPE_LABELS.length - 1;
            // Lookup tables (indices are uint8) so the loop below needs no includes()
            const table = (hidden) => {
                const t = new Uint8Array(256);
                hidden.forEach((i) => { t[i] = 1; });
                return t;
            };
            const hiddenMuseum = table(this.hiddenMuseums);
            const hiddenWorkType = table(this.hiddenWorkTypes);
            const hiddenCentury = table(this.hiddenCenturies);
            const mask = new Float32Array(museums.length);
            for (let i = 0; i < mask.length; i++) {
                // Same fallbacks as _workTypeOf and _centuryOf
                const wt = workTypes[i] <= lastWorkType ? workTypes[i] : lastWorkType;
                const century = centuries ? centuries[i] : UNDATED_CENTURY;
                mask[i] = hiddenMuseum[museums[i]] | hiddenWorkType[wt] | hiddenCentury[century] ? 0 : 1;
            }
            visibilityMask = { key, value: mask };
            return mask;
        },

        _buildLayer(colorArray, dimmed) {
            const { deck } = window;
            const self = this;
            return new deck.ScatterplotLayer({
                id: 'artworks',
                data: {
                    length: this._museumIndices.length,
                    attributes: {
                        getPosition: pointAttributes.position,
                        getFillColor: colorArray,
                        getFilterValue: { value: this._visibilityMask(), size: 1 },
                    },
                },
                // Colours carry alpha 200; dimming for a search scales that to SEARCH_DIM_ALPHA
                opacity: dimmed ? SEARCH_DIM_ALPHA / 200 : 1,
                // Legend filters run on the GPU: hidden points are neither drawn nor picked.
                // (luma.gl logs harmless "uniform ... not present" warnings for this extension)
                extensions: [new deck.DataFilterExtension({ filterSize: 1 })],
                filterRange: [0.5, 1],
                radiusMinPixels: 1.5,
                radiusMaxPixels: 6,
                radiusUnits: 'pixels',
                getRadius: 3,
                pickable: true,
                onHover: (info) => self._onHover(info),
                onClick: (info) => self._onClick(info),
            });
        },

        _onHover(info) {
            if (isTouch) return;
            if (info.index >= 0) {
                const idx = info.index;
                const museumIdx = this._museumIndices[idx];
                const slug = MUSEUM_SLUGS[museumIdx];
                const m = this._metadata;
                if (m) {
                    this.tooltip = {
                        visible: true,
                        imageError: false,
                        x: info.x,
                        y: info.y,
                        title: m.title[idx] || 'Untitled',
                        artist: m.artist[idx] || 'Unknown',
                        museum: MUSEUM_NAMES[museumIdx],
                        imageUrl: this._imageUrl(slug, m.object_number[idx]),
                    };
                } else {
                    this.tooltip = {
                        visible: true,
                        imageError: false,
                        x: info.x,
                        y: info.y,
                        title: 'Loading...',
                        artist: '',
                        museum: MUSEUM_NAMES[museumIdx],
                        imageUrl: '',
                    };
                }
            } else {
                this.tooltip.visible = false;
            }
        },

        _onClick(info) {
            if (info.index < 0 || !this._metadata) return;
            this._select(info.index);
        },

        _parseGeometry(buffer) {
            const count = new DataView(buffer).getUint32(0, true);
            const x = new Float32Array(buffer, 4, count);
            const y = new Float32Array(buffer, 4 + count * 4, count);
            const museum = new Uint8Array(buffer, 4 + count * 8, count);
            const workType = new Uint8Array(buffer, 4 + count * 9, count);
            // Century groups were appended later; older geometry ends after the work types
            const century = buffer.byteLength >= 4 + count * 11 ? new Uint8Array(buffer, 4 + count * 10, count) : null;
            return { count, x, y, museum, workType, century };
        },

        // Starts once the geometry is in (so the two don't share bandwidth), and parses
        // (~0.3s for ~18 MB of JSON) only after `rendered`, so it doesn't delay the first frame
        async _loadMetadata(rendered) {
            try {
                const resp = await fetch('{% url "art-map-data" %}?v={{ map_data_version }}');
                await rendered;
                if (resp.ok) {
                    this._metadata = await resp.json();
                }
            } catch (e) {
                // Metadata is non-critical; tooltips will show "Loading..."
            }
        },

        async init() {
            // Read the URL before anything is awaited: the legend and _updateUrl
            // work from this state
            this._filtersFromUrl();
            const urlParams = new URLSearchParams(window.location.search);
            this._linkedArtwork = urlParams.get('artwork');
            this.searchQuery = this._urlQuery = (urlParams.get('q') || '').trim();
            const view = this._viewFromUrl();
            if (view) {
                this._viewTarget = view.target;
                this._currentZoom = view.zoom;
            }
            try {
                const resp = await fetch('{% url "art-map-geometry" %}?v={{ map_data_version }}');
                if (!resp.ok) throw new Error('Map data not found. Run: make art-map');
                const buffer = await resp.arrayBuffer();
                const geo = this._parseGeometry(buffer);

                this._museumIndices = geo.museum;
                this._workTypeIndices = geo.workType;
                this._centuryIndices = geo.century;
                this.hasCenturies = geo.century !== null;
                if (!this.hasCenturies) {
                    // A century URL shared after the next `make art-map`; fall back until then
                    if (this.colorMode === 'century') this.colorMode = 'work_type';
                    this.hiddenCenturies = [];
                    this._updateUrl();
                }

                // The spinner stays up until deck.gl has drawn the points (onAfterRender)
                let onFirstRender;
                const rendered = new Promise((resolve) => { onFirstRender = resolve; });
                this.createDeck(geo, view, onFirstRender);

                // Metadata loads in the background; a linked artwork needs it to be found,
                // and flying to it only works once deck.gl has drawn
                this._metadataLoaded = this._loadMetadata(rendered);
                this._metadataLoaded.then(() => {
                    this._selectFromUrl(view !== null);
                    // A shared search (?q=); keep the shared view or the linked artwork in view
                    if (this.searchQuery) this.runSearch(view === null && this.selectedIndex < 0);
                });
            } catch (e) {
                this.error = e.message;
                this.loading = false;
            }
        },

        createDeck(geo, view, onFirstRender) {
            const { deck } = window;
            const self = this;
            const count = geo.count;

            // Build interleaved positions (coordinates are pre-scaled)
            const positions = new Float32Array(count * 2);
            for (let i = 0; i < count; i++) {
                positions[i * 2] = geo.x[i];
                positions[i * 2 + 1] = geo.y[i];
            }
            this._positions = positions;

            // Pre-build an RGBA colour array per colour mode; unknown indices get the last
            // ("other"/"undated") colour. Palettes are unwrapped from Alpine's proxies first.
            const buildColorArray = (indices, palette) => {
                const colors = Alpine.raw(palette).map((c) => Alpine.raw(c));
                const ca = new Uint8Array(count * 4);
                for (let i = 0; i < count; i++) {
                    const c = colors[indices[i]] || colors[colors.length - 1];
                    ca[i * 4] = c[0];
                    ca[i * 4 + 1] = c[1];
                    ca[i * 4 + 2] = c[2];
                    ca[i * 4 + 3] = 200;
                }
                return { value: ca, size: 4, normalized: true };
            };
            pointAttributes = {
                position: { value: positions, size: 2 },
                colors: {
                    museum: buildColorArray(geo.museum, this.museumColors),
                    work_type: buildColorArray(geo.workType, this.workTypeColors),
                    century: geo.century ? buildColorArray(geo.century, this.centuryColors) : null,
                },
            };

            this.deckgl = new deck.Deck({
                canvas: 'deck-canvas',
                views: new deck.OrthographicView(),
                initialViewState: view || {
                    target: [500, 500],
                    zoom: -0.5,
                },
                controller: true,
                pickingRadius: isTouch ? 25 : 0,
                // Colour mode and filters may come from the URL. Layers must be passed
                // here: the filter extension fails if set before deck.gl is initialised
                layers: this._layers(),
                getTooltip: () => null,
                // Clicks on empty map space (not drags, which pan) close the detail panel
                onClick: (info) => {
                    if (info.index < 0) self.closeDetail();
                },
                onAfterRender: () => {
                    if (!self.loading) return;
                    self.loading = false;
                    onFirstRender();
                },
                onError: (e) => {
                    self.error = 'The map could not be displayed in this browser.';
                    self.loading = false;
                    // Lets the metadata load go on, so searches don't hang waiting for it
                    onFirstRender();
                    console.error(e);
                },
                onViewStateChange: ({ viewState }) => {
                    self._currentZoom = viewState.zoom;
                    self._viewTarget = viewState.target;
                    clearTimeout(self._urlTimer);
                    self._urlTimer = setTimeout(() => self._updateUrl(), 300);
                },
            });
        },
    };
}
</script>
