# Fixed project name, so every checkout (including worktrees) shares one dev stack
name: semantic-art-search

services:
  # PostgreSQL database
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: artsearch_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_dumps:/db_dumps:ro  # prod dumps for make sync-db-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d artsearch_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:v1.16.3
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC

  # Django web app
  web:
    build: .
    command: /bin/sh -c /code/entrypoint.dev.sh
    environment:
      # npm runs Tailwind's scripts as the owner of the mounted checkout (uid 1000),
      # who can't write root's ~/.npm; without this `tailwind build` fails after
      # it has already deleted the compiled CSS
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
